<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    </head>

    <body class="bg-slate-50 text-slate-800 font-sans antialiased">
        
        <!--Navigation Bar-->
        
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-100">
            <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
                <div class="text-xl font-bold text-indigo-600 tracking-tight">
                    Product<span class="text-slate-900">Name</span>
                </div>
            
                <nav class="hidden md:flex items-center space-x-8 font-medium text-sm text-slate-600">
                    <a href="#features" class="hover:text-indigo-600 transition-colors">Features</a>
                    <a href="#" class="hover:text-indigo-600 transition-colors">Pricing</a>
                    <a href="#" class="hover:text-indigo-600 transition-colors">About</a>
                </nav>

                <div>
                    <a href="#" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition-all shadow-sm">Get Started</a>
                </div>
            </div>
        </header>

        <!--Advertising Banner-->

        <main>
            <section class="max-w-7xl mx-auto px-6 py-20 lg:py-32 flex flex-col lg:flex-row items-center justify-between gap-12">
                <div class="flex-1 text-center lg:text-left max-w-2xl">
                    
                    <span class="inline-flex items-center gap-1.5 py-1 px-3 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 mb-6">✨ Introducing Product</span>
                    
                    <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black text-slate-900 tracking-tight leading-tight mb-6">TEXT <span class="text-indigo-600">TEXT</span></h1>
                    
                    <p class="text-lg text-slate-600 mb-8 leading-relaxed">TEXT</p>
                    
                    <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                        <a href="#" class="bg-slate-950 text-white px-6 py-3 rounded-xl font-medium hover:bg-slate-800 transition-all text-center">Start Free Trial</a>
                        <a href="#" class="border border-slate-200 bg-white text-slate-700 px-6 py-3 rounded-xl font-medium hover:bg-slate-50 transition-all text-center">Book a Demo</a>
                    </div>
                
                </div>

                <div class="flex-1 w-full max-w-md lg:max-w-none">
                    <div class="aspect-video lg:aspect-square bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl shadow-xl flex items-center justify-center text-white p-8">
                        <div class="text-center">
                            <div class="text-5xl mb-4">📊</div>
                            <p class="font-semibold text-lg">Preview</p>
                        </div>
                    </div>
                </div>
            </section>

            <section id="features" class="bg-white border-y border-slate-100 py-20 lg:py-28">
                <div class="max-w-7xl mx-auto px-6">
                    <div class="text-center max-w-2xl mx-auto mb-16">
                        <h2 class="text-3xl font-bold text-slate-900 mb-4 tracking-tight">TEXT</h2>
                        <p class="text-slate-600">TEXT</p>
                    </div>

                    <div class="flex flex-col md:flex-row justify-between items-stretch gap-8">
                        <article class="flex-1 bg-slate-50 p-8 rounded-2xl border border-slate-100 flex flex-col justify-between hover:shadow-md transition-all">
                            <div>
                                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-xl mb-6">⚡</div>
                                <h3 class="text-xl font-bold text-slate-900 mb-3">TEXT</h3>
                                <p class="text-slate-600 leading-relaxed">TEXT</p>
                            </div>
                        </article>

                        <article class="flex-1 bg-slate-50 p-8 rounded-2xl border border-slate-100 flex flex-col justify-between hover:shadow-md transition-all">
                            <div>
                                <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-xl mb-6">🔒</div>
                                <h3 class="text-xl font-bold text-slate-900 mb-3">TEXT</h3>
                                <p class="text-slate-600 leading-relaxed">TEXT</p>
                            </div>
                        </article>

                        <article class="flex-1 bg-slate-50 p-8 rounded-2xl border border-slate-100 flex flex-col justify-between hover:shadow-md transition-all">
                            <div>
                                <div class="w-12 h-12 bg-pink-100 text-pink-600 rounded-xl flex items-center justify-center text-xl mb-6">🗣️</div>
                                <h3 class="text-xl font-bold text-slate-900 mb-3">TEXT</h3>
                                <p class="text-slate-600 leading-relaxed">TEXT</p>
                            </div>
                        </article>
                    </div>
                </div>
            </section>
        </main>

        <footer class="bg-slate-950 text-slate-400 py-12 text-sm">
            <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-6">
                <div><p>&copy; TEXT All rights reserved.</p></div>
            
                <div class="flex gap-6">
                    <a href="#" class="hover:text-white transition-colors">Privacy Policy</a>
                    <a href="#" class="hover:text-white transition-colors">Terms of Service</a>
                    <a href="#" class="hover:text-white transition-colors">Contact Support</a>
                </div>
            </div>
        </footer>
    </body>
</html>
