<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
        <style>
            h2 { font-family: 'Playfair Display', serif; }
            body, label, input, button, p { font-family: 'Plus Jakarta Sans', sans-serif; }
        </style>
    </head>

    <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
        <main class="w-full max-w-md bg-white p-8 rounded-2xl border border-slate-200/80 shadow-xl shadow-slate-100">
        
        <header class="mb-8 text-center">
            <h2 class="text-3xl font-bold text-slate-800">Login</h2>
            <p class="text-sm text-slate-500 mt-2">Please enter your details to login</p>
        </header>

        <form action="#" class="space-y-5">
            
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-700 tracking-wide uppercase">
                    Email Address
                </label>
                <input placeholder="you@example.com" class="w-full p-3 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:bg-white transition-all"/>
            </div>

            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-slate-700 tracking-wide uppercase">Password</label>
                </div>
                <input placeholder="••••••••" class="w-full p-3 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:bg-white transition-all"/>
            </div>

            <button class="w-full h-11 mt-2 bg-slate-900 text-white font-medium text-sm rounded-lg hover:bg-slate-800 focus:ring-2 focus:ring-slate-900/20 transition-all cursor-pointer">
                Sign In
            </button>

        </form>


    </main>
    </body>
</html>
