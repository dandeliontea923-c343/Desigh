<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <title>Account Login</title>

    <style>
        h2 { font-family: 'Playfair Display', serif; }
        body, label, input, button, p, a { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-white p-8 rounded-2xl border border-slate-200/80 shadow-xl shadow-slate-100">
        
        <header class="mb-8 text-center">
            <h2 class="text-3xl font-bold text-slate-800">Welcome Back</h2>
            <p class="text-sm text-slate-500 mt-2">Please enter your details to sign in</p>
        </header>

        <form action="#" method="POST" class="space-y-5">
            
            <div class="flex flex-col gap-1.5">
                <label for="email" class="text-xs font-semibold text-slate-700 tracking-wide uppercase">
                    Email Address
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="you@example.com" 
                    required
                    class="w-full p-3 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:bg-white transition-all"
                />
            </div>

            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center">
                    <label for="password" class="text-xs font-semibold text-slate-700 tracking-wide uppercase">
                        Password
                    </label>
                    <a href="#" class="text-xs font-medium text-indigo-600 hover:underline">Forgot password?</a>
                </div>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••" 
                    required
                    class="w-full p-3 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:bg-white transition-all"
                />
            </div>

            <div class="flex items-center gap-2 py-1">
                <input 
                    type="checkbox" 
                    id="remember" 
                    name="remember" 
                    class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                >
                <label for="remember" class="text-sm text-slate-600 select-none">Remember me for 30 days</label>
            </div>

            <button 
                type="submit" 
                class="w-full h-11 mt-2 bg-slate-900 text-white font-medium text-sm rounded-lg hover:bg-slate-800 focus:ring-2 focus:ring-slate-900/20 transition-all cursor-pointer"
            >
                Sign In
            </button>

        </form>

        <footer class="mt-8 text-center">
            <p class="text-sm text-slate-500">
                Don't have an account? 
                <a href="#" class="font-semibold text-indigo-600 hover:underline ml-1">Sign up free</a>
            </p>
        </footer>

    </main>

</body>
</html>
